<style>
  /* hand-lettering (OFL fonts: Caveat, Patrick Hand) */
  @font-face { font-family: 'Caveat'; font-weight: 700; font-display: swap; src: url(./fonts/caveat-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Caveat'; font-weight: 600; font-display: swap; src: url(./fonts/caveat-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Patrick Hand'; font-weight: 400; font-display: swap; src: url(./fonts/patrick-hand-latin-400-normal.woff2) format('woff2'); }
  :root {
    --paper: #f6efdf; --paper2: #efe4cc; --ink: #2a2230; --ink2: #5a4e5e; --accent: #e8604c; --gold: #e4b84f;
    --sketch: 255px 14px 225px 16px / 16px 225px 14px 255px;   /* a hand-drawn box */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ead7; font-family: 'Patrick Hand', 'Comic Sans MS', cursive; color: var(--ink); }
  canvas { display: block; touch-action: none; outline: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .ui { position: fixed; z-index: 10; }
  .sk { background: var(--paper); border: 2.5px solid var(--ink); border-radius: var(--sketch); box-shadow: 3px 4px 0 rgba(42,34,48,0.85); }
  button.sk { font: inherit; font-size: 19px; color: var(--ink); padding: 7px 20px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; }
  button.sk:hover { transform: translate(-1px,-1px) rotate(-0.6deg); box-shadow: 5px 6px 0 rgba(42,34,48,0.85); }
  button.sk:active { transform: translate(2px,3px); box-shadow: 1px 1px 0 rgba(42,34,48,0.85); }
  button.go { background: var(--gold); }
  .hide { opacity: 0 !important; pointer-events: none !important; }
  .fade { transition: opacity .5s ease; }

  /* the name card, top left */
  #card { left: 14px; top: 12px; padding: 6px 16px 8px; transform: rotate(-0.6deg); max-width: min(420px, 70vw); }
  #card h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(30px, 5vw, 44px); line-height: 1; margin: 0; }
  #card p { margin: 0; font-size: 16px; color: var(--ink2); }
  #card a { color: var(--ink2); }

  /* the buttons, bottom centre */
  #bar { left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 32px); }
  #hint { left: 50%; bottom: calc(max(18px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%); font-size: 16px; color: var(--ink2);
    background: rgba(246,239,223,.85); padding: 2px 14px; border-radius: var(--sketch); white-space: nowrap; pointer-events: none; }
  #label { left: 50%; top: 18px; transform: translateX(-50%); font-family: 'Caveat', cursive; font-size: 26px; padding: 2px 16px; pointer-events: none; white-space: nowrap; }

  /* loading */
  #load { inset: 0; z-index: 40; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #load h2 { font-family: 'Caveat', cursive; font-size: clamp(40px, 8vw, 72px); margin: 0; transform: rotate(-2deg); }
  #load .track { width: min(320px, 70vw); height: 14px; border: 2.5px solid var(--ink); border-radius: var(--sketch); overflow: hidden; }
  #load .fill { height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  #load p { margin: 0; color: var(--ink2); }
  #fade { inset: 0; z-index: 30; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity .45s ease; display: flex; align-items: center; justify-content: center; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #fade { flex-direction: column; gap: 6px; }
  #fade span { font-family: 'Caveat', cursive; font-size: 34px; }
  /* the crew hanging a painting (only while the gallery's first being built). Every moving part
     is its own element animated by transform, so it keeps moving even while the build is busy */
  #fade .crew { display: none; position: relative; width: 380px; height: 300px; max-width: 92vw; }
  #fade.hanging .crew { display: block; }
  #fade .crew svg { position: absolute; overflow: visible; }
  #fade .set { left: 0; top: 0; }
  #fade .held { left: 213px; top: 58px; transform-origin: 60px 140px; animation: steady 1.3s ease-in-out infinite; will-change: transform; }
  #fade .arm { left: 159px; top: 113px; transform-origin: 6px 20px; animation: hammer .62s ease-in infinite; will-change: transform; }
  #fade .tap { position: absolute; left: 196px; top: 26px; font: 700 26px 'Caveat', cursive; color: #e8604c; opacity: 0;
    animation: tap .62s linear infinite; will-change: transform, opacity; }
  #fade .tap.two { left: 236px; top: 14px; animation-delay: .31s; animation-duration: 1.24s; }
  @keyframes hammer { 0% { transform: rotate(-112deg); } 60% { transform: rotate(-118deg); } 78% { transform: rotate(-49deg); } 84% { transform: rotate(-53deg); } 100% { transform: rotate(-112deg); } }
  @keyframes tap { 0%, 76% { opacity: 0; transform: scale(.4) rotate(-8deg); } 82% { opacity: 1; transform: scale(1.15) rotate(-8deg); } 100% { opacity: 0; transform: translateY(-12px) scale(1) rotate(-8deg); } }
  @keyframes steady { 0%, 100% { transform: rotate(-2.5deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-3px); } }
  @media (max-width: 420px) { #fade .crew { transform: scale(.82); } }

  /* the close look at one painting */
  /* (the painting itself, in its frame, is drawn on the canvas behind: js/viewer.js) */
  #view { inset: 0; z-index: 20; background: transparent; display: flex; align-items: flex-end; justify-content: center; padding: 18px 18px max(28px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  #view .wrap { display: flex; flex-direction: column; align-items: center; }
  #view .info { padding: 6px 18px; text-align: center; max-width: 92vw; transform: rotate(-0.6deg); }
  #view .info b { font-family: 'Caveat', cursive; font-size: 32px; display: block; line-height: 1.05; }
  #view .info span { color: var(--ink2); font-size: 16px; }
  #view .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 30px; padding: 4px 16px; }
  #prev { left: 14px; } #next { right: 14px; }
  #view .x { position: absolute; top: 14px; right: 14px; font-size: 18px; }
  body.viewing #bar, body.viewing #hint, body.viewing #label { opacity: 0; pointer-events: none; }
  body.viewing #pad { opacity: 0; pointer-events: none; }
  #snd { right: max(14px, env(safe-area-inset-right)); top: 12px; font-size: 17px; padding: 5px 14px; transform: rotate(1deg); }
  body.viewing #snd { opacity: 0; pointer-events: none; }

  /* phones, inside: a D-pad bottom left (walk ▲▼, turn ◀▶), the buttons stacked bottom right */
  #pad { left: max(14px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); display: none;
    grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); gap: 4px; touch-action: none; }
  body.pad #pad { display: grid; }
  #pad button { font: 700 24px/1 'Patrick Hand', cursive; color: var(--ink); background: var(--paper); border: 2.5px solid var(--ink);
    border-radius: 14px 18px 12px 16px; box-shadow: 2px 3px 0 rgba(42,34,48,.85); padding: 0; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #pad button.on { background: var(--gold); transform: translate(2px, 3px); box-shadow: 0 0 0 rgba(42,34,48,.85); }
  #pad .up { grid-area: 1 / 2; } #pad .lt { grid-area: 2 / 1; } #pad .rt { grid-area: 2 / 3; } #pad .dn { grid-area: 3 / 2; }
  #pad .mid { grid-area: 2 / 2; border-radius: 50%; margin: 10px; background: var(--paper2); box-shadow: none; pointer-events: none; }
  body.pad #bar { left: auto; right: max(14px, env(safe-area-inset-right)); transform: none; flex-direction: column; align-items: flex-end; gap: 8px; }
  body.pad #bar button.sk { font-size: 16px; padding: 6px 14px; }
  body.pad #hint { display: none; }
  @media (max-width: 600px) { #hint { display: none; } }   /* (phones: the buttons wrap where it would sit) */

  /* the hand at the door holding out the brochure */
  #offer { right: 0; bottom: 120px; z-index: 15; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    transform: translateX(110%); transition: transform .7s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
  #offer.in { transform: none; pointer-events: auto; }
  #offer .bubble { padding: 4px 14px; font-size: 17px; margin-right: 24px; transform: rotate(-2deg); }
  #offer .take { background: none; border: 0; padding: 0; cursor: pointer; animation: hold 2.4s ease-in-out infinite; }
  #offer .no { background: none; border: 0; font: inherit; font-size: 14px; color: var(--ink2); text-decoration: underline; cursor: pointer; margin-right: 24px; }
  @keyframes hold { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-3deg) translateY(-4px); } }
  body.viewing #offer, body.reading #offer { display: none; }
  /* the brochure: two panels either side of a fold, opening out */
  #brochure { inset: 0; z-index: 22; background: rgba(36,28,42,.55); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; perspective: 1600px; }
  /* parchment: warm uneven paper, fibres and blotches (SVG noise), edges browned and darkened like old vellum */
  #brochure .paper { position: relative; display: grid; grid-template-columns: 1fr 1fr; width: min(980px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
    background-color: #efdfb8;
    background-image:
      radial-gradient(ellipse at 50% 45%, rgba(255,248,225,.75) 0%, rgba(255,244,215,.35) 45%, rgba(160,110,50,0) 70%),
      radial-gradient(circle at 18% 22%, rgba(150,100,40,.12) 0 6%, transparent 14%),
      radial-gradient(circle at 82% 70%, rgba(150,100,40,.1) 0 5%, transparent 12%),
      radial-gradient(circle at 64% 12%, rgba(150,100,40,.08) 0 4%, transparent 10%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .12  0 0 0 .28 0'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='4' seed='9'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .16  0 0 0 .5 -.12'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
    border: 1.5px solid rgba(110,70,30,.55); border-radius: 3px;
    box-shadow: inset 0 0 60px rgba(120,70,20,.45), inset 0 0 14px rgba(90,50,15,.5), 6px 9px 22px rgba(30,18,10,.55); }
  #brochure .paper h2, #brochure .paper h3 { color: #4a2e1a; }
  #brochure .left h2 { color: #a8361e !important; }
  #brochure p, #brochure .by, #brochure .n { color: #4e3a28 !important; }
  #brochure .left { border-right-color: rgba(110,70,30,.35) !important; }
  #brochure .paper::after { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 30px; transform: translateX(-50%); pointer-events: none;
    background: linear-gradient(90deg, rgba(42,34,48,0), rgba(42,34,48,.13) 45%, rgba(255,255,255,.4) 52%, rgba(42,34,48,0)); }
  #brochure.open .left { animation: unfoldL .8s cubic-bezier(.3,1.2,.5,1) both; transform-origin: right center; }
  #brochure.open .right { animation: unfoldR .8s cubic-bezier(.3,1.2,.5,1) both; transform-origin: left center; }
  @keyframes unfoldL { from { transform: rotateY(70deg); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes unfoldR { from { transform: rotateY(-70deg); opacity: .4; } to { transform: none; opacity: 1; } }
  #brochure .panel { padding: 26px 30px 24px; }
  #brochure .left { border-right: 1.5px dashed rgba(42,34,48,.25); }
  #brochure h2 { font-family: 'Caveat', cursive; font-size: 46px; margin: 0; line-height: 1; }
  #brochure .left h2 { color: var(--accent); font-size: 56px; transform: rotate(-2deg); }
  #brochure .by { margin: 2px 0 14px; color: var(--ink2); font-size: 16px; letter-spacing: .04em; }
  #brochure h3 { font-family: 'Caveat', cursive; font-size: 27px; margin: 0; line-height: 1.05; }
  #brochure p { margin: 3px 0 0; font-size: 16px; line-height: 1.32; color: #3a3240; }
  #brochure .about { display: flex; gap: 14px; align-items: flex-start; margin: 14px 0; }
  #brochure .about img { width: 92px; height: 92px; object-fit: cover; border: 5px solid #e4b84f; outline: 2px solid var(--ink); flex: none; transform: rotate(-2deg); }
  #brochure .about:nth-child(odd) img { transform: rotate(2deg); }
  #brochure .coll { margin: 12px 0 16px; }
  #brochure .go { font: 700 15px 'Patrick Hand', cursive; letter-spacing: .05em; margin-top: 6px; padding: 5px 14px; background: transparent;
    border: 2px solid var(--ink); border-radius: 3px; cursor: pointer; color: var(--ink); }
  #brochure .go:hover { background: var(--gold); }
  #brochure .n { font-size: 14px; color: var(--ink2); }
  #brochure .x { position: sticky; float: right; top: 8px; right: 8px; margin: 8px 8px -40px auto; grid-column: 2; z-index: 2; font-size: 16px; padding: 3px 12px; }
  @media (max-width: 700px) {
    #brochure .paper { grid-template-columns: 1fr; }
    #brochure .paper::after { display: none; }
    #brochure .left { border-right: 0; border-bottom: 1.5px dashed rgba(42,34,48,.25); }
    #brochure .x { grid-column: 1; }
    #brochure .panel { padding: 22px 18px; }
    #offer { bottom: 200px; } #offer svg { width: 170px; height: 116px; }
  }

  /* every work at once */
  #index { inset: 0; z-index: 20; background: rgba(243,234,215,.97); overflow-y: auto; padding: 70px 18px 40px; box-sizing: border-box; }
  #index h2 { font-family: 'Caveat', cursive; font-size: 46px; margin: 0 0 14px; text-align: center; }
  #index .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
  #index figure { margin: 0; cursor: pointer; transition: transform .12s; }
  #index figure:hover { transform: rotate(-1deg) scale(1.03); }
  #index img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 6px solid #e4b84f; outline: 2px solid var(--ink); display: block; background: #fff; }
  #index figcaption { font-size: 15px; text-align: center; margin-top: 4px; color: var(--ink2); }
  #index .x { position: fixed; top: 14px; right: 18px; }
</style>

<button id="snd" class="ui sk" aria-label="sound on or off">♪ sound on</button>
<div id="label" class="ui sk hide fade"></div>
<div id="hint" class="ui fade"></div>
